<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu - Dar Hassna</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background-color: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    
    h1, h2 {
      color: #2c3e50;
      text-align: center;
    }
    
    .menu-category {
      margin-bottom: 30px;
    }
    
    .category-title {
      background-color: #2c3e50;
      color: white;
      padding: 10px 15px;
      border-radius: 5px;
      margin-bottom: 15px;
    }
    
    .menu-items {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }
    
    .menu-item {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      transition: transform 0.3s;
    }
    
    .menu-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    
    .item-name {
      font-weight: bold;
      font-size: 1.2em;
      margin-bottom: 5px;
      color: #2c3e50;
    }
    
    .item-price {
      font-weight: bold;
      color: #e74c3c;
      font-size: 1.1em;
      margin: 10px 0;
    }
    
    .item-description {
      color: #7f8c8d;
      font-size: 0.9em;
      margin-bottom: 10px;
    }
    
    .item-image {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 5px;
      margin-bottom: 10px;
    }
    
    @media (max-width: 768px) {
      .menu-items {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Menu Dar Hassna</h1>
    
    <div id="menu-container">
      <!-- سيتم ملؤها من Firebase -->
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  
  <script>
    // تكوين Firebase (استخدم نفس التكوين من نظامك)
    const firebaseConfig = {
      apiKey: "AIzaSyDpSF4J0bsd6T0ImMpse0KQQRADaxiYUQw",
      authDomain: "darhassna-484c3.firebaseapp.com",
      databaseURL: "https://darhassna-484c3-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "darhassna-484c3",
      storageBucket: "darhassna-484c3.firebasestorage.app",
      messagingSenderId: "141393162149",
      appId: "1:141393162149:web:0717227eac221f5ddfc24c"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    // عرض القائمة
    function displayMenu() {
      db.ref("menu").once('value').then((snapshot) => {
        const menuItems = snapshot.val();
        const categories = {};
        
        // تجميع الأصناف حسب الفئة
        Object.values(menuItems).forEach(item => {
          if (!categories[item.category]) {
            categories[item.category] = [];
          }
          if (item.isAvailable) {
            categories[item.category].push(item);
          }
        });
        
        // عرض القائمة
        let menuHTML = '';
        
        for (const [category, items] of Object.entries(categories)) {
          if (items.length > 0) {
            menuHTML += `
              <div class="menu-category">
                <h2 class="category-title">${category}</h2>
                <div class="menu-items">
                  ${items.map(item => `
                    <div class="menu-item">
                      ${item.image ? `<img src="${item.image}" alt="${item.name}" class="item-image">` : ''}
                      <div class="item-name">${item.name}</div>
                      <div class="item-price">${item.price} MAD</div>
                      <div class="item-description">${item.description}</div>
                    </div>
                  `).join('')}
                </div>
              </div>
            `;
          }
        }
        
        document.getElementById('menu-container').innerHTML = menuHTML || '<p>Le menu est actuellement vide</p>';
      });
    }
    
    // تشغيل العرض عند تحميل الصفحة
    window.addEventListener('DOMContentLoaded', displayMenu);
  </script>
</body>
</html>
